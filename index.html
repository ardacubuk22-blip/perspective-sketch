<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3FB8">
<meta name="description" content="Learn perspective drawing step by step, on real paper. By @perspective.sketch">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Perspective Sketch App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: one phone-width column; a drafting-paper canvas is the hero of every screen; lesson path like a game map; bottom tab bar */
:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --paper:#FBFCFE; --grid:#E2E9F2;
  --ink:#1E2228; --muted:#5B6573; --line:#D3DAE3;
  --guide:#7DAEE0; --accent:#2D5BFF; --accent-deep:#1B3DC2; --accent-ink:#FFFFFF; --accent-soft:#DDE5FF;
  --new:#F0661E; --marker:#FFC53D; --ok:#17996A; --ok-deep:#0F7550; --vp:#E0352B; --lock:#C3CBD6; --lock-deep:#A5AFBC;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#191D24; --paper:#1F242C; --grid:#283039;
  --ink:#E8ECF1; --muted:#9CA6B3; --line:#2C343F;
  --guide:#4E7FB5; --accent:#6F8CFF; --accent-deep:#4560D6; --accent-ink:#0C1020; --accent-soft:#232C4A;
  --new:#FF8A4A; --marker:#FFC53D; --ok:#36C48A; --ok-deep:#21915F; --vp:#FF5F55; --lock:#38414D; --lock-deep:#272E37;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191D24; --paper:#1F242C; --grid:#283039;
  --ink:#E8ECF1; --muted:#9CA6B3; --line:#2C343F;
  --guide:#4E7FB5; --accent:#6F8CFF; --accent-deep:#4560D6; --accent-ink:#0C1020; --accent-soft:#232C4A;
  --new:#FF8A4A; --marker:#FFC53D; --ok:#36C48A; --ok-deep:#21915F; --vp:#FF5F55; --lock:#38414D; --lock-deep:#272E37;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.app{max-width:480px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.app.full{padding-bottom:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.brand svg{width:34px;height:34px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip .ico{width:17px;height:17px}
.chip.flame .ico{stroke:var(--new)} .chip.star .ico{stroke:var(--marker);fill:var(--marker)}
.chip.pro{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* paper */
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.art{display:block;width:100%;height:auto;aspect-ratio:4/3}
.art .sh{fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .ink{stroke:var(--art-ink,var(--ink));stroke-width:2.4}
.art .thin{stroke:var(--art-ink,var(--ink));stroke-width:1.4}
.art .guide{stroke:var(--art-guide,var(--guide));stroke-width:1.3}
.art .measure{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3;stroke-linecap:round}
.art .mlab{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--accent)}
.art .guide.dash{stroke-dasharray:5 4}
.art path.new.guide.dash,.art path.new.measure{stroke-dashoffset:0;opacity:0;animation:fade .7s ease forwards;animation-delay:calc(var(--i)*.85s)}
.art path.new.guide.dash{stroke-dasharray:5 4}
.art path.new.measure{stroke-dasharray:4 3}
.art .new.mlab{opacity:0;animation:fade .5s ease forwards;animation-delay:calc(var(--i)*.85s)}
.art .shade{fill:url(#hatch);stroke:none}
.art .shadeLight{fill:url(#hatchLight);stroke:none}
.hl{stroke:var(--art-ink,var(--ink));stroke-width:1.1}
.art .dot circle{fill:var(--vp)}
.art .lab{font-family:var(--hand);font-size:19px;fill:var(--vp)}
.art .lab.hor{fill:var(--guide)}
.art .new.ink,.art .new.thin{stroke:var(--new)}
.art .new.guide{stroke:var(--new);opacity:.65}
.art path.new.ink,.art path.new.thin,.art path.new.guide{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.5,0,.3,1) forwards;animation-delay:calc(var(--i)*.85s)}
.art .new.shade,.art .new.shadeLight,.art .new.lab{opacity:0;animation:fade .7s ease forwards;animation-delay:calc(var(--i)*.85s)}
.art .start{fill:none;stroke:var(--new);stroke-width:2.4;opacity:0;transform-box:fill-box;transform-origin:center;animation:startpulse .9s ease-out forwards;animation-delay:calc(var(--i)*.85s)}
@keyframes startpulse{0%{opacity:1;transform:scale(.3)}55%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4)}}
.art g.dot.new circle{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.85s)}
.art g.dot.new .lab{opacity:0;animation:fade .5s ease forwards;animation-delay:calc(var(--i)*.85s + .2s)}
.art.final .guide{opacity:.4}
.art.final .dot circle{opacity:.55}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pop{to{transform:scale(1)}}

/* continue card */
.continue{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.continue .paper{border-radius:10px}
.continue h2{font-size:19px;margin:3px 0 10px}
.continue > div{min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-deep)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:9px 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* units & path */
.unit{display:flex;flex-direction:column;gap:14px}
.unit-head{border-radius:16px;padding:14px 16px;background:var(--accent);color:var(--accent-ink)}
.unit-head .eyebrow{color:inherit;opacity:.8}
.unit-head h2{font-size:22px;margin-top:2px}
.unit-head p{font-size:14px;opacity:.9;margin-top:4px}
.unit.u2 .unit-head{background:var(--ok);color:#fff}
.unit.u3 .unit-head{background:var(--ink);color:var(--bg)}
.path{list-style:none;margin:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:20px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));position:relative}
.node .nb{width:70px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;font-family:var(--display);font-weight:800;font-size:22px}
.node .nb .ico{width:28px;height:28px;stroke-width:2.6}
.node.done .nb{background:var(--ok);color:#fff;box-shadow:0 6px 0 var(--ok-deep)}
.node.current .nb{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 var(--accent-deep)}
.node.locked .nb,.node.soon .nb{background:var(--lock);color:var(--muted);box-shadow:0 6px 0 var(--lock-deep)}
.node.current .nb::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--accent);opacity:.35;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.12);opacity:0}}
.node .gem{position:absolute;right:-6px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--marker);color:#3A2A00;display:grid;place-items:center}
.node .gem .ico{width:15px;height:15px;stroke-width:2.2}
.node .lbl{font-weight:600;font-size:13px;text-align:center;max-width:150px;line-height:1.25}
.node.locked .lbl,.node.soon .lbl{color:var(--muted)}
.start{position:absolute;top:-30px;background:var(--surface);border:1.5px solid var(--line);color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:8px;white-space:nowrap}
.foot-note{font-size:13px;color:var(--muted);text-align:center}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.segs{flex:1;display:flex;gap:5px;min-width:0}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.segs i.on{background:var(--ok)}
.segs i.cur{background:var(--new)}
.lnum{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.lbody{display:flex;flex-direction:column;gap:8px}
.lbody h2{font-size:26px}
.lbody p.txt{font-size:16.5px;max-width:60ch}
.tip{font-family:var(--hand);font-size:22px;color:var(--new);line-height:1.15}
.rule{font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600}
.kchip i{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--new)}
.kchip.k-vp i{color:var(--vp)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:18px;height:3px;border-radius:2px}
.lactions{display:grid;grid-template-columns:auto auto 1fr;gap:10px}

/* complete */
.done-head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.done-head h1{font-size:30px}
.reward{display:flex;gap:10px;justify-content:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:18px}
.upload{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:14px;padding:16px;font-weight:600;cursor:pointer;text-align:center}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.compare figcaption{font-size:12px;color:var(--muted);text-align:center}
.compare img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow code{flex:1;min-width:0;font-family:var(--mono);font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}

/* challenge */
.hero-c{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero-c .eyebrow{color:inherit;opacity:.7}
.hero-c h1{font-size:28px}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.bar span{display:block;height:100%;background:var(--marker);border-radius:99px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.day{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;position:relative;padding:0}
.day.done{background:var(--ok);border-color:var(--ok);color:#fff}
.day.next{border-color:var(--accent);color:var(--accent);border-width:2.5px}
.day.locked{color:var(--muted);background:transparent}
.day.sel{outline:3px solid var(--marker);outline-offset:2px}
.day .pdot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--marker)}
.prompt{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.2}

/* profile */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.plan{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:26px}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat .ico{stroke:var(--ok);margin-top:2px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.planopt{border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:2px;position:relative}
.planopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.planopt b{font-family:var(--display);font-size:20px}
.planopt small{color:var(--muted);font-size:12.5px}
.save{position:absolute;top:-10px;right:10px;background:var(--marker);color:#3A2A00;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.fine{font-size:12.5px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
/* onboarding */
.onb{display:flex;flex-direction:column;gap:18px;padding-top:8px}
.onb h1{font-size:32px}
.who{display:grid;gap:12px}
.whobtn{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px}
.whobtn:hover{border-color:var(--accent)}
.whobtn > div{min-width:0}
.whobtn b{font-family:var(--display);font-size:20px;display:block;line-height:1.15}
.whobtn span{font-size:14px;color:var(--muted)}
.whobtn .paper{border-radius:10px}
.iconbtn[aria-pressed="false"]{color:var(--muted)}
.extras{display:flex;gap:10px;flex-wrap:wrap}
a.btn{text-decoration:none;color:inherit}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:700}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* kids mode: colour fills instead of hatching, bigger text */
:root{--kid1:#FFB547;--kid2:#7FD3F7;--kid3:#FF8DBF}
.brand>div{min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.stats{gap:5px}.chip{padding:5px 8px;font-size:13px}.brand{font-size:15px;gap:8px}.brand svg{width:30px;height:30px}}
.sw,.paper{position:relative}
.sw{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;border:1px solid var(--line);background-size:14px 14px}
.sw-grid,body[data-paper="grid"] .paper{}
.sw-grid{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
.sw-dots,body[data-paper="dots"] .paper{background-color:var(--paper);background-image:radial-gradient(var(--line) 1.3px,transparent 1.6px);background-size:16px 16px}
.sw-kraft,body[data-paper="kraft"] .paper{background-color:#E6D2AA;background-image:linear-gradient(rgba(90,60,20,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(90,60,20,.12) 1px,transparent 1px);border-color:#CDB58A}
body[data-paper="kraft"] .paper{background-size:20px 20px}
.sw-blueprint,body[data-paper="blueprint"] .paper{background-color:#1D4F8F;background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);border-color:#163E72}
body[data-paper="blueprint"] .paper{background-size:20px 20px}
body[data-paper="kraft"]{--art-ink:#3A2814;--art-guide:#3F78B8}
body[data-paper="blueprint"]{--art-ink:#F2F6FF;--art-guide:#8EC2FF}
.art .lab.hor{fill:var(--art-guide,var(--guide))}
.chip.gemc .ico{stroke:var(--accent)}
.node .meta{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.node .meta .ico{width:13px;height:13px;stroke:var(--accent)}
.newpill{background:var(--new);color:#fff;font:700 10px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:6px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--muted);min-width:0}
.badge i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--lock);color:var(--muted)}
.badge i .ico{width:24px;height:24px}
.badge.on{color:var(--ink);font-weight:600}
.badge.on i{background:var(--marker);color:#3A2A00}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shopitem{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--surface)}
.shopitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.shopitem b{font-size:14px}
.shopitem small{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600}
.shopitem small .ico{width:13px;height:13px;stroke:var(--accent)}
.newbadge{display:flex;align-items:center;gap:12px;background:var(--marker);color:#3A2A00;border-radius:16px;padding:12px 14px}
.newbadge i{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.banner{display:flex;gap:10px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:12px 14px;background:var(--accent-soft)}
.banner p{font-size:14px;flex:1 1 200px;min-width:0}
.banner b{font-family:var(--display)}
.banner.warn{background:color-mix(in srgb,var(--marker) 32%,var(--surface))}
.banner.gift{background:var(--ok);color:#fff}
.coderow{display:flex;gap:8px}
.coderow input{flex:1;min-width:0;font:600 15px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.coderow input:focus{outline:3px solid var(--accent);outline-offset:1px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.kid .art .shade,.kidpick .art .shade{fill:var(--kid1);opacity:.8}
.kid .art .shadeLight,.kidpick .art .shadeLight{fill:var(--kid2);opacity:.65}
.kid .unit.u1 .unit-head{background:var(--kid3);color:#2A0A1A}
.kid .unit.u2 .unit-head{background:var(--kid1);color:#2A1800}
.kid .unit.u3 .unit-head{background:var(--kid2);color:#04263A}
.kid .lbody p.txt{font-size:19px}
.kid .lbody h2{font-size:30px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
/* draw anything library */
.libsec{display:flex;flex-direction:column;gap:12px}
.libsec h2{font-size:22px}
.libgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.libcard{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 10px;box-shadow:0 4px 0 var(--line)}
.libcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.lc-t{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;padding-inline:2px}
.lc-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);padding-inline:2px}
.lc-m .ico{width:14px;height:14px}
.lc-done{color:var(--ok);display:inline-flex}.lc-lock{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700}
/* coloring */
.colorwrap{position:relative;touch-action:none}
.colorwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.colorwrap svg{position:relative;pointer-events:none}
.colorart .ink,.colorart .thin{stroke:var(--ink)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw2{aspect-ratio:1;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw2.on{box-shadow:0 0 0 3px var(--ink)}
.ctools{display:flex;flex-direction:column;gap:10px}
.ctools .seg2{grid-template-columns:repeat(3,1fr)}
.row2{display:flex;flex-wrap:wrap;gap:8px}
/* submissions */
.field{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600}
.field input{font:inherit;font-weight:500;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.field input:focus{outline:3px solid var(--accent);outline-offset:1px}
.fine2{font-size:13px;color:var(--muted)}
.sentok h3{display:flex;align-items:center;gap:8px;color:var(--ok)}
.mhead{display:flex;align-items:center;gap:12px}
.mhead h1{font-size:26px}
.subs{display:flex;flex-direction:column;gap:12px}
.sub{display:grid;grid-template-columns:92px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;align-items:start}
.sub img,.sub .ph{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:block}
.sub .meta2{display:flex;flex-direction:column;gap:6px;min-width:0}
.sub .meta2 b{font-size:15px}
.sub small{color:var(--muted);font-size:12.5px}
.st{align-self:flex-start;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.st.approved{background:var(--ok);color:#fff}.st.rejected{background:var(--lock);color:var(--ink)}.st.feat{background:var(--marker);color:#1E2228}
.stars{display:inline-flex;gap:1px}.stars span{color:var(--line);display:inline-flex}.stars span.on{color:var(--marker)}.stars .ico{width:17px;height:17px;fill:currentColor;stroke:currentColor}
.rnote{font-size:14px;background:var(--paper);border-inline-start:3px solid var(--accent);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
/* ================= Design system v2: premium studio look (visual layer only) ================= */
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface-2:#FBF9F5; --paper:#FFFEFB; --grid:#ECE7DE;
  --ink:#171A21; --ink-2:#2B303A; --muted:#5E6573; --line:#E5DFD5; --line-2:#D8D1C5;
  --guide:#7FA8DA; --accent:#1F3FB8; --accent-deep:#152C86; --accent-ink:#FFFFFF; --accent-soft:#EAEEFB;
  --new:#E8621B; --pink:#D9467E; --marker:#F0A92E; --ok:#14865A; --ok-deep:#0D6643; --ok-soft:#E3F3EA;
  --vp:#D93A2F; --lock:#ECE8E1; --lock-deep:#DAD3C8;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(23,26,33,.05),0 1px 1px rgba(23,26,33,.03);
  --sh-2:0 1px 2px rgba(23,26,33,.04),0 8px 24px -8px rgba(23,26,33,.10);
  --sh-3:0 2px 6px rgba(23,26,33,.06),0 18px 40px -16px rgba(23,26,33,.18);
  --kid1:#FFB547; --kid2:#8FD0F2; --kid3:#F59AC0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318; --surface:#1A1D24; --surface-2:#1E222A; --paper:#1F232B; --grid:#2A3039;
  --ink:#EDEFF3; --ink-2:#D5D9E0; --muted:#9AA3B1; --line:#2C323C; --line-2:#3A414D;
  --guide:#5B8BC6; --accent:#7D95FF; --accent-deep:#4D63D6; --accent-ink:#0B1020; --accent-soft:#222A47;
  --new:#FF8A4A; --pink:#F06EA0; --marker:#F5BD4F; --ok:#38C489; --ok-deep:#21915F; --ok-soft:#183427;
  --vp:#FF6A5F; --lock:#262B34; --lock-deep:#1D2129;
  --sh-1:none; --sh-2:0 8px 24px -12px rgba(0,0,0,.6); --sh-3:0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1A1D24; --surface-2:#1E222A; --paper:#1F232B; --grid:#2A3039;
  --ink:#EDEFF3; --ink-2:#D5D9E0; --muted:#9AA3B1; --line:#2C323C; --line-2:#3A414D;
  --guide:#5B8BC6; --accent:#7D95FF; --accent-deep:#4D63D6; --accent-ink:#0B1020; --accent-soft:#222A47;
  --new:#FF8A4A; --pink:#F06EA0; --marker:#F5BD4F; --ok:#38C489; --ok-deep:#21915F; --ok-soft:#183427;
  --vp:#FF6A5F; --lock:#262B34; --lock-deep:#1D2129;
  --sh-1:none; --sh-2:0 8px 24px -12px rgba(0,0,0,.6); --sh-3:0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark}

/* typography scale */
body{font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--bg)}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;color:var(--ink)}
h1{font-size:30px;line-height:1.08}
h2{font-size:22px;line-height:1.15}
h3{font-size:17px;line-height:1.25;letter-spacing:-.01em}
.eyebrow{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.fine2,.foot-note{color:var(--muted)}

/* layout rhythm */
.app{gap:20px;padding-top:18px}
.panel,.continue,.stat,.libcard,.sub,.whobtn{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2)}
.panel{border-radius:var(--r-lg);padding:20px;gap:14px}
.panel h3{font-size:17px}

/* header */
.top{padding:2px 0}
.brand{font-size:16.5px;letter-spacing:-.01em;font-weight:700}
.brand small{font-size:12px;letter-spacing:0;color:var(--muted)}
.chip{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);padding:6px 11px;font-size:13.5px;gap:6px}
.chip .ico{width:16px;height:16px}

/* buttons: one family */
.btn{border-radius:var(--r-md);font-weight:650;letter-spacing:-.005em;transition:transform .12s ease,box-shadow .12s ease,background-color .15s ease}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep),0 8px 20px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 92%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ok{box-shadow:0 3px 0 var(--ok-deep)}
.btn.ok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ok-deep)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-1);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.small{border-radius:12px}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--sh-1);border-radius:12px}
.seg2 button{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-weight:650;box-shadow:var(--sh-1)}
.seg2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.linkbtn{color:var(--accent)}

/* banners: quiet */
.banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);box-shadow:var(--sh-1);border-radius:var(--r-md);padding:12px 14px}
.banner.warn{border-left-color:var(--new);background:var(--surface)}
.banner.gift{background:var(--ok-soft);color:var(--ink);border-left-color:var(--ok)}

/* continue card */
.continue{border-radius:var(--r-lg);padding:14px;grid-template-columns:124px 1fr;gap:16px}
.continue .paper{border-radius:var(--r-sm)}
.continue h2{font-size:20px;margin:4px 0 12px}

/* paper */
.paper{border-color:var(--line);border-radius:var(--r-md)}

/* unit headers: white cards with a colour key instead of full colour blocks */
.unit{gap:18px}
.unit-head,.unit.u2 .unit-head,.unit.u3 .unit-head{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-2);border-radius:var(--r-lg);padding:16px 18px 16px 20px;position:relative;overflow:hidden}
.unit-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.unit.u2 .unit-head::before{background:var(--new)}
.unit.u3 .unit-head::before{background:var(--pink)}
.unit-head .eyebrow{color:var(--accent);opacity:1}
.unit.u2 .unit-head .eyebrow{color:color-mix(in srgb,var(--new) 85%,var(--ink))}
.unit.u3 .unit-head .eyebrow{color:color-mix(in srgb,var(--pink) 85%,var(--ink))}
.unit-head h2{font-size:22px;margin-top:4px}
.unit-head p{color:var(--muted);opacity:1;font-size:14px}

/* lesson path */
.path{gap:30px;padding:14px 0 6px}
.node .nb{width:68px;height:68px;font-size:22px;transition:transform .15s ease}
.node .nb:hover{transform:translateY(-1px)}
.node.done .nb{background:var(--ok);box-shadow:0 5px 0 var(--ok-deep),0 10px 20px -10px var(--ok)}
.node.current .nb{background:var(--accent);box-shadow:0 5px 0 var(--accent-deep),0 12px 24px -10px var(--accent)}
.node.locked .nb,.node.soon .nb{background:var(--surface);color:color-mix(in srgb,var(--muted) 80%,var(--line));border:1px solid var(--line-2);box-shadow:0 5px 0 var(--lock-deep)}
.node .gem{background:var(--surface);color:var(--accent);border:1px solid var(--line-2);box-shadow:var(--sh-1);width:24px;height:24px}
.node .lbl{font-size:13px;font-weight:650;color:var(--ink-2)}
.node .meta{font-size:11.5px}
.start{top:-28px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 10px;font-size:10px;letter-spacing:.12em;box-shadow:var(--sh-1)}
.newpill{background:color-mix(in srgb,var(--new) 14%,var(--surface));color:color-mix(in srgb,var(--new) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--new) 35%,transparent);padding:1px 6px;border-radius:999px;font-size:9.5px}

/* hero (Draw + 30 days) */
.hero-c{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-2);border-radius:var(--r-xl);padding:22px;gap:10px;position:relative;overflow:hidden}
.hero-c::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent) 60%,var(--new) 60%,var(--new) 80%,var(--pink) 80%)}
.hero-c .eyebrow{color:var(--accent);opacity:1}
.hero-c h1{font-size:28px;max-width:20ch}
.hero-c p{color:var(--muted)}
.bar{background:var(--lock);height:8px}
.bar span{background:var(--ok)}

/* 30 days */
.days{gap:8px}
.day{border:1px solid var(--line-2);border-radius:12px;background:var(--surface);font-size:13.5px;box-shadow:var(--sh-1);color:var(--ink-2)}
.day.done{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.day.next{border:2px solid var(--accent);color:var(--accent)}
.day.locked{background:transparent;box-shadow:none;color:var(--muted)}
.day.sel{outline:2px solid var(--ink);outline-offset:2px}
.day .pdot{background:var(--line-2);width:6px;height:6px;top:5px;right:5px}
.prompt{font-size:20px;letter-spacing:-.01em}

/* draw library */
.libsec{gap:14px}
.libsec h2{font-size:21px}
.libgrid{gap:14px}
.libcard{border-radius:var(--r-lg);padding:8px 8px 12px;gap:8px;box-shadow:var(--sh-2);transition:transform .15s ease,box-shadow .15s ease}
.libcard:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
.libcard:active{transform:translateY(0);box-shadow:var(--sh-1)}
.libcard .paper{border-radius:var(--r-md)}
.lc-t{font-size:15.5px;padding-inline:4px;letter-spacing:-.01em}
.lc-m{padding-inline:4px}
.lc-lock{color:var(--accent)}

/* profile */
.grid4{gap:12px}
.stat{border-radius:var(--r-lg);padding:16px}
.stat b{font-size:28px;letter-spacing:-.02em}
.stat span{font-size:12.5px;font-weight:600}
.badge i{background:var(--lock);border:1px solid var(--line)}
.badge.on i{background:color-mix(in srgb,var(--marker) 22%,var(--surface));color:color-mix(in srgb,var(--marker) 60%,var(--ink));border-color:color-mix(in srgb,var(--marker) 55%,transparent)}
.shopitem{border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--sh-1)}
.shopitem[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.copyrow code{background:var(--surface-2);border:1px solid var(--line)}
.coderow input,.field input{border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}

/* lesson screen */
.segs i{height:6px;background:var(--lock)}
.segs i.on{background:var(--ok)}
.segs i.cur{background:var(--accent)}
.lbody h2{font-size:26px}
.lbody p.txt{font-size:16.5px;color:var(--ink-2)}
.kchip{border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--sh-1);font-size:12.5px}
.rule{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md)}

/* completion */
.newbadge{background:color-mix(in srgb,var(--marker) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--marker) 45%,transparent);color:var(--ink)}
.newbadge i{background:var(--surface);color:color-mix(in srgb,var(--marker) 70%,var(--ink))}
.upload{border:1.5px dashed var(--line-2);border-radius:var(--r-md);background:var(--surface-2)}

/* sheet + toast */
.sheet{border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3)}
.planopt{border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.planopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.toast{border-radius:999px;padding:10px 18px;box-shadow:var(--sh-3)}

/* bottom navigation: floating, refined */
.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-top:6px}
.tabs div{gap:4px}
.tabs button{padding:7px 4px 6px;font-size:11.5px;font-weight:650;letter-spacing:.01em;color:var(--muted);border-radius:14px;transition:color .15s ease,background-color .15s ease}
.tabs button .ico{width:22px;height:22px;stroke-width:1.9}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs button[aria-current="page"] .ico{stroke-width:2.3}

/* kids mode: soft tints, never loud blocks */
.kid .unit.u1 .unit-head,.kid .unit.u2 .unit-head,.kid .unit.u3 .unit-head{color:var(--ink)}
.kid .unit.u1 .unit-head{background:color-mix(in srgb,var(--kid3) 14%,var(--surface))}
.kid .unit.u2 .unit-head{background:color-mix(in srgb,var(--kid1) 16%,var(--surface))}
.kid .unit.u3 .unit-head{background:color-mix(in srgb,var(--kid2) 18%,var(--surface))}
.kid .unit.u1 .unit-head::before{background:var(--pink)}
.kid .unit.u2 .unit-head::before{background:var(--new)}
.kid .unit.u3 .unit-head::before{background:var(--accent)}

/* responsive: tablet and desktop */
@media (min-width:720px){
  .app{max-width:640px;gap:24px;padding-top:26px}
  .tabs div{max-width:520px}
  .tabs{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh-3);padding:6px 8px}
  .app{padding-bottom:120px}
  .app.full{padding-bottom:32px}
  h1{font-size:34px}
  .hero-c{padding:28px}
  .hero-c h1{font-size:32px}
  .libgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid4{grid-template-columns:repeat(4,1fr)}
  .days{grid-template-columns:repeat(10,1fr)}
  .continue{grid-template-columns:168px 1fr;padding:16px}
  .badges{grid-template-columns:repeat(5,1fr)}
  .toast{bottom:104px}
}
@media (min-width:1100px){
  .app{max-width:720px}
  .libgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
}
/* ================= Learn screen v2 ================= */
.app.learnv{gap:18px}
/* next up */
.nextup{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:14px;position:relative;overflow:hidden}
.nextup::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.nu-art{border-radius:var(--r-md);align-self:stretch;display:flex;align-items:center}
.nu-art .art{height:100%}
.nu-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.nu-body h2{font-size:21px;line-height:1.15}
.nu-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.nu-meta span{display:inline-flex;align-items:center;gap:4px}
.nu-meta span+span::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--line-2);margin-right:6px}
.nu-meta .ico{width:13px;height:13px;stroke:var(--accent)}
.nu-cta{margin-top:6px;min-height:46px}

<script>
/* ---------- icons ---------- */
const I={

  back:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  cam:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  copy:'<svg class="ico" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></svg>',

  mute:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',

};
const WS='https://ardacubuk22-blip.github.io/perspective-sketch/worksheets/';
const LOGO='<svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="var(--accent)"/><path d="M4 14h26" stroke="var(--accent-ink)" stroke-opacity=".45" stroke-width="1.5"/><path d="M5 29L17 14l12 15" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linejoin="round"/><path d="M11 29l6-15 6 15" fill="none" stroke="var(--accent-ink)" stroke-opacity=".6" stroke-width="1.6"/><circle cx="17" cy="14" r="2.8" fill="var(--marker)"/></svg>';

/* ---------- geometry ---------- */
const W=400,H=300;
const L=(a,b,k='ink')=>({t:'l',a,b,k});
const G=(a,b)=>L(a,b,'guide');
const Th=(a,b)=>L(a,b,'thin');
const D=(p,label)=>({t:'d',p,label});
const P=(pts,k='shade')=>({t:'p',pts,k});
const T=(p,s,c='')=>({t:'t',p,s,c});
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const atX=(p,q,x)=>{const t=(x-p[0])/(q[0]-p[0]);return [x,p[1]+(q[1]-p[1])*t]};
const atY=(p,q,y)=>{const t=(y-p[1])/(q[1]-p[1]);return [p[0]+(q[0]-p[0])*t,y]};
function inter(p1,p2,p3,p4){const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]);const a=p1[0]*p2[1]-p1[1]*p2[0],b=p3[0]*p4[1]-p3[1]*p4[0];return [(a*(p3[0]-p4[0])-(p1[0]-p2[0])*b)/d,(a*(p3[1]-p4[1])-(p1[1]-p2[1])*b)/d]}
function ext(p,q){const dx=q[0]-p[0],dy=q[1]-p[1],ts=[];if(dx>0)ts.push((W-p[0])/dx);if(dx<0)ts.push(-p[0]/dx);if(dy>0)ts.push((H-p[1])/dy);if(dy<0)ts.push(-p[1]/dy);const t=Math.min(...ts);return [p[0]+dx*t,p[1]+dy*t]}

/* ---------- lessons ---------- */
function road(){const hy=120,V=[200,hy],E=[360,300];
  const B1=lerp(V,E,.95),T1=[B1[0],B1[1]-140],M1=lerp(B1,T1,.5);
  const B2=lerp(V,E,.72),T2=atX(V,T1,B2[0]),M2=atX(V,M1,B2[0]);
  const B3=inter(T1,M2,V,E),T3=atX(V,T1,B3[0]),M3=atX(V,M1,B3[0]);
  const B4=inter(T2,M3,V,E),T4=atX(V,T1,B4[0]),M4=atX(V,M1,B4[0]);
  const B5=inter(T3,M4,V,E),T5=atX(V,T1,B5[0]);
  return [
    {title:'Find your eye level',text:'Draw a light horizontal line across the page. This is the horizon: the height of your eyes.',tip:'press softly, it is only a guide',shapes:[G([10,hy],[390,hy]),T([300,hy-9],'horizon','hor')]},
    {title:'Place the vanishing point',text:'Put one dot in the middle of the horizon. Everything that goes away from you meets at this point.',tip:'VP = vanishing point',shapes:[D(V,'VP')]},
    {title:'Draw the road',text:'From the dot, draw two lines down to the bottom corners of the page. That is a road running to the horizon.',tip:'use a ruler for clean lines',shapes:[L(V,[40,300]),L(V,E)]},
    {title:'Dash the centre line',text:'Add the centre line as dashes. Each dash gets shorter as it gets closer to the vanishing point.',tip:'smaller = further away',shapes:[[.14,.19],[.26,.34],[.44,.56],[.68,.86]].map(([a,b])=>L(lerp(V,[200,300],a),lerp(V,[200,300],b)))},
    {title:'The first two poles',text:'Draw the closest pole on the road edge. Run a guide line from its top to the VP. Choose where the second pole stands: its top touches that guide line.',tip:'all poles are the same height in real life',shapes:[G(V,ext(V,T1)),L(B1,T1),L(B2,T2)]},
    {title:'Find the middle',text:'Mark the middle of the first pole. Draw a guide line from that point to the VP. It cuts every pole exactly in half.',tip:'the half-way line',shapes:[D(M1,''),G(M1,V),D(M2,'')]},
    {title:'Measure the next pole',text:'Draw a diagonal from the top of the first pole through the middle of the second pole, down to the road edge. That is where the third pole stands.',tip:'top, then middle, then ground',shapes:[G(T1,B3),L(B3,T3)]},
    {title:'Repeat the measuring',text:'Do it again: from the top of pole two through the middle of pole three, then from pole three through pole four. The gaps shrink exactly as they should.',tip:'equal spaces in real life',shapes:[G(T2,B4),L(B4,T4),G(T3,B5),L(B5,T5)]}
  ]}
function box1(){const hy=110,V=[200,hy],A=[90,170],B=[170,170],C=[170,240],Dd=[90,240],t=.35;
  const A2=lerp(A,V,t),B2=lerp(B,V,t),C2=lerp(C,V,t),D2=lerp(Dd,V,t);
  return [
    {title:'Horizon and one VP',text:'Draw the horizon and put one vanishing point on it.',tip:'one-point = one VP',shapes:[G([10,hy],[390,hy]),D(V,'VP')]},
    {title:'Draw the front square',text:'Below and to the left of the VP, draw a square facing you. Its sides are perfectly vertical and horizontal.',tip:'front faces never bend',shapes:[L(A,B),L(B,C),L(C,Dd),L(Dd,A)]},
    {title:'Connect corners to the VP',text:'Draw a light line from each corner of the square to the vanishing point.',tip:'these are the depth lines',shapes:[G(A,V),G(B,V),G(C,V),G(Dd,V)]},
    {title:'Choose the depth',text:'Decide how deep the box is. Draw the back edges: one across for the top, one straight down for the side.',tip:'parallel to the front edges',shapes:[L(A2,B2),L(B2,C2)]},
    {title:'Ink the visible edges',text:'Ink the edges between the front and the back that you can see. Leave the hidden ones out.',tip:'3 edges, not 4',shapes:[L(A,A2),L(B,B2),L(C,C2)]},
    {title:'Shade it',text:'Shade the side away from the light, and give the top a light tone. That is a box in one-point perspective.',tip:'dark side + light top = 3D',shapes:[P([B,B2,C2,C]),P([A,A2,B2,B],'shadeLight')]}
  ]}
function room(){const hy=140,V=[200,hy],p1=[140,100],p2=[260,100],p3=[260,180],p4=[140,180];
  const w0t=[60,90],w0b=[60,170],w1t=atX(V,w0t,105),w1b=atX(V,w0b,105);
  const tiles=[40,120,200,280,360].map(x=>L(atY(V,[x,300],180),[x,300],'thin'));
  const rows=[205,235,270].map(y=>Th([Math.max(0,atY(V,p4,y)[0]),y],[Math.min(400,atY(V,p3,y)[0]),y]));
  const corner=p=>[G(V,p),L(p,ext(V,p))];
  return [
    {title:'Horizon and VP',text:'Start with the horizon and a vanishing point in the middle of the page.',tip:'this is where you stand',shapes:[G([10,hy],[390,hy]),D(V,'VP')]},
    {title:'Draw the back wall',text:'Draw a rectangle around the vanishing point, one side at a time: top, right, bottom, left. This is the far wall of the room.',tip:'the VP sits inside it',shapes:[L(p1,p2),L(p2,p3),L(p3,p4),L(p4,p1)]},
    {title:'The first corner line',text:'Put your ruler on the VP and on the top left corner of the wall. Draw a light line from the VP to the corner, then keep going in the same direction to the edge of the page.',tip:'start at the VP, pass the corner, keep going',shapes:corner(p1)},
    {title:'The other three corners',text:'Do the same for the other three corners, one at a time. Start at the VP, pass through the corner and continue to the edge. Now you have a ceiling, a floor and two side walls.',tip:'four lines, four planes',shapes:[...corner(p2),...corner(p3),...corner(p4)]},
    {title:'The door',text:'On the back wall, draw the left side of the door straight up from the floor line. Then draw the top, then the right side.',tip:'the back wall faces you, so no VP here',shapes:[L([168,180],[168,128]),L([168,128],[196,128]),L([196,128],[196,180])]},
    {title:'Window: the near edge',text:'On the left wall, draw one vertical line. This is the edge of the window closest to you.',tip:'verticals stay vertical',shapes:[L(w0t,w0b)]},
    {title:'Window: top and bottom',text:'Put your ruler on the VP and on the top of that line, and draw a light line. Do the same for the bottom. The window sits between these two lines.',tip:'start at the VP',shapes:[G(V,w0t),G(V,w0b)]},
    {title:'Window: the far edge',text:'Draw a second vertical line between the two guide lines. Then ink the top and the bottom of the window along the guides.',tip:'',shapes:[L(w1t,w1b),L(w0t,w1t),L(w0b,w1b)]},
    {title:'Floor lines to the VP',text:'Draw lines from the bottom of the back wall down to the bottom of the page, one at a time. Every line points back to the VP.',tip:'line your ruler up with the VP each time',shapes:tiles},
    {title:'Floor lines across',text:'Now draw horizontal lines across the floor. Make the gaps smaller as they get closer to the back wall.',tip:'closer lines = more distance',shapes:rows},
    {title:'Shade a wall',text:'Shade the right wall to show where the light comes from. Your first room is done.',tip:'light from the left',shapes:[P([p2,ext(V,p2),ext(V,p3),p3],'shadeLight')]}
  ]}
function box2geo(){const hy=100,V1=[20,hy],V2=[380,hy],F0=[200,150],F1=[200,240];
  const L0=atX(F0,V1,140),L1=atX(F1,V1,140),R0=atX(F0,V2,270),R1=atX(F1,V2,270),K=inter(L0,V2,R0,V1);
  return {hy,V1,V2,F0,F1,L0,L1,R0,R1,K}}
function box2(){const g=box2geo(),{hy,V1,V2,F0,F1,L0,L1,R0,R1,K}=g;
  return [
    {title:'Two vanishing points',text:'Draw the horizon and put a vanishing point near each end of it.',tip:'wide apart = less distortion',shapes:[G([10,hy],[390,hy]),D(V1,'VP1'),D(V2,'VP2')]},

    const out={};
    out.base=[G(V,ext(V,b0))];
    out.near=[L(b0,top)];
    out.top1=[G(V,top),L(top,tp(x2))];
    out.v1=[L(bot(x2),tp(x2))];
    out.top2=[L(t2,tp2(x3)),L(bot(x3),tp2(x3))];
    const rows=[.25,.45,.65].map(f=>lerp(top,b0,f));

    out.shade=[P([b0,top,tp(x2),bot(x2)],'shadeLight')];

  const Lf=side(-1),Rt=side(1);

    {title:'The windows',text:'Draw the windows along the guide lines. Their sides are vertical. They get narrower toward the VP.',tip:'narrower = further away',shapes:[...Lf.wi,...Rt.wi]},
    {title:'Road markings and shade',text:'Dash the centre line, making each dash shorter near the VP. Tone the left buildings. Your street is done.',tip:'',shapes:[...dash,...Lf.shade]}
  ]}

/* every edge that goes back in depth gets a dashed guide from its VP, unless one is already drawn */
function autoGuides(list){for(const l of list){
  const vps=[];l.steps.forEach(st=>st.shapes.forEach(sh=>{if(sh.t==='d'&&/^VP/.test(sh.label||''))vps.push(sh.p)}));
  const seen=[];
  l.steps.forEach(st=>{const add=[];
    for(const sh of st.shapes){if(sh.t!=='l')continue;seen.push(sh);if(sh.k==='guide')continue;
      const dx=sh.b[0]-sh.a[0],dy=sh.b[1]-sh.a[1],len=Math.hypot(dx,dy);if(len<3)continue;
      if(Math.abs(dy)<.6&&len>300)continue;
      for(const v of vps){
        if(Math.abs(dx*(v[1]-sh.a[1])-dy*(v[0]-sh.a[0]))/len>=1.6)continue;
        const da=Math.hypot(sh.a[0]-v[0],sh.a[1]-v[1]),db=Math.hypot(sh.b[0]-v[0],sh.b[1]-v[1]);if(Math.min(da,db)<1.5)break;
        const near=da<db?sh.a:sh.b,target=Math.min(da,db);
        const iv=[];for(const o of seen.concat(add)){const odx=o.b[0]-o.a[0],ody=o.b[1]-o.a[1],ol=Math.hypot(odx,ody);if(ol<1)continue;
          const on=p=>Math.abs(dx*(p[1]-sh.a[1])-dy*(p[0]-sh.a[0]))/len<1.6;if(!on(o.a)||!on(o.b))continue;
          const sd=p=>{const d=Math.hypot(p[0]-v[0],p[1]-v[1]);return ((p[0]-v[0])*(near[0]-v[0])+(p[1]-v[1])*(near[1]-v[1]))<-1?-d:d};
          const x1=sd(o.a),x2=sd(o.b);iv.push([Math.min(x1,x2),Math.max(x1,x2)])}
        iv.sort((p,q)=>p[0]-q[0]);let reach=1.5;for(const [a0,b0] of iv){if(a0<=reach+40)reach=Math.max(reach,b0)}
        if(reach<target-2)add.push(Object.assign(G(v,near),{auto:true}));
        break}}
    if(add.length)st.shapes.unshift(...add)})}}

function lineKinds(l,i){

  const c={horizon:0,vert:0,hor:0,vp:{},slant:0,round:0};
  for(const sh of l.steps[i].shapes){

    const dx=sh.b[0]-sh.a[0],dy=sh.b[1]-sh.a[1],len=Math.hypot(dx,dy);if(len<3)continue;

function colorLinesSVG(stroke,w){const sv=document.querySelector('#cw svg');if(!sv)return '';const c=sv.cloneNode(true);c.setAttribute('width','800');c.setAttribute('height','600');c.setAttribute('xmlns','http://www.w3.org/2000/svg');
  c.querySelectorAll('path').forEach(p=>{p.setAttribute('fill','none');p.setAttribute('stroke',stroke);p.setAttribute('stroke-width',p.classList.contains('thin')?w*.7:w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');p.removeAttribute('class');p.removeAttribute('pathLength')});
  return new XMLSerializer().serializeToString(c)}
function svgImg(str){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str)})}
async function colorInit(){const cv=document.getElementById('cc');if(!cv)return;col.undo=[];
  try{const im=await svgImg(colorLinesSVG('#000',2.2));const w=document.createElement('canvas');w.width=800;w.height=600;const x=w.getContext('2d');x.drawImage(im,0,0,800,600);col.wall=x.getImageData(0,0,800,600).data}catch(e){col.wall=null}
  let drawing=false,last=null;const ctx=cv.getContext('2d');
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*600/r.height]};
  cv.onpointerdown=e=>{e.preventDefault();pushUndo();const p=pos(e);
    if(col.tool==='fill'){flood(ctx,Math.floor(p[0]),Math.floor(p[1]),col.color);return}
    drawing=true;last=p;cv.setPointerCapture(e.pointerId);stroke(ctx,p,p)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);stroke(ctx,last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false}}
function stroke(ctx,a,b){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=col.tool==='erase'?34:18;
  if(col.tool==='erase')ctx.globalCompositeOperation='destination-out';else{ctx.strokeStyle=col.color;ctx.globalAlpha=.85}
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0]+.01,b[1]);ctx.stroke();ctx.restore()}
function pushUndo(){const cv=document.getElementById('cc');col.undo.push(cv.getContext('2d').getImageData(0,0,800,600));if(col.undo.length>15)col.undo.shift()}
function flood(ctx,x0,y0,hex){if(x0<0||y0<0||x0>=800||y0>=600)return;
  const img=ctx.getImageData(0,0,800,600),d=img.data,wall=col.wall,Wd=800,Ht=600;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const i0=(y0*Wd+x0)*4;if(wall&&wall[i0+3]>90)return;
  const tr=d[i0],tg=d[i0+1],tb=d[i0+2],ta=d[i0+3];if(ta>200&&Math.abs(tr-r)<4&&Math.abs(tg-g)<4&&Math.abs(tb-b)<4)return;
  const same=i=>(!wall||wall[i+3]<=90)&&Math.abs(d[i]-tr)<30&&Math.abs(d[i+1]-tg)<30&&Math.abs(d[i+2]-tb)<30&&Math.abs(d[i+3]-ta)<60;
  const seen=new Uint8Array(Wd*Ht),st=[[x0,y0]];
  while(st.length){let [x,y]=st.pop();let i=y*Wd+x;while(x>=0&&!seen[i]&&same(i*4)){x--;i--}x++;i++;let up=false,dn=false;
    while(x<Wd&&!seen[i]&&same(i*4)){seen[i]=1;const k=i*4;d[k]=r;d[k+1]=g;d[k+2]=b;d[k+3]=255;
      if(y>0){const j=i-Wd;if(!seen[j]&&same(j*4)){if(!up){st.push([x,y-1]);up=true}}else up=false}
      if(y<Ht-1){const j=i+Wd;if(!seen[j]&&same(j*4)){if(!dn){st.push([x,y+1]);dn=true}}else dn=false}
      x++;i++}}
  /* grow 2px under the lines so no white halo is left */
  for(let pass=0;pass<2;pass++){const add=[];for(let y=1;y<Ht-1;y++)for(let x=1;x<Wd-1;x++){const i=y*Wd+x;if(seen[i])continue;if(!(wall&&wall[i*4+3]>90))continue;if(seen[i-1]||seen[i+1]||seen[i-Wd]||seen[i+Wd])add.push(i)}
    for(const i of add){seen[i]=1;const k=i*4;d[k]=r;d[k+1]=g;d[k+2]=b;d[k+3]=255}}
  ctx.putImageData(img,0,0)}
async function colorSave(){try{const cv=document.getElementById('cc');const out=document.createElement('canvas');out.width=800;out.height=600;const x=out.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,800,600);x.drawImage(cv,0,0);const im=await svgImg(colorLinesSVG('#1E2228',2.4));x.drawImage(im,0,0,800,600);
  out.toBlob(b=>{if(!b){toast('Could not save the picture');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(curL().id||'drawing')+'-colored.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Picture saved')},'image/png')}catch(e){toast('Could not save the picture')}}

/* ---------- render helpers ---------- */
const f=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function art(lesson,upto,mode){
  let polys='',lines='',top='';
  for(let i=0;i<=upto;i++){
    const isNew=mode==='step'&&i===upto;let j=0;
    for(const s of lesson.steps[i].shapes){
      const cls=isNew?' new':'',st=isNew?` style="--i:${j++}"`:'';
      if(s.t==='m'){if(mode!=='step'||upto-i>1)continue;const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],ln=Math.hypot(dx,dy)||1,nx=-dy/ln*5,ny=dx/ln*5;
        lines+=`<path d="M${f(s.a)}L${f(s.b)}M${(s.a[0]+nx).toFixed(1)} ${(s.a[1]+ny).toFixed(1)}L${(s.a[0]-nx).toFixed(1)} ${(s.a[1]-ny).toFixed(1)}M${(s.b[0]+nx).toFixed(1)} ${(s.b[1]+ny).toFixed(1)}L${(s.b[0]-nx).toFixed(1)} ${(s.b[1]-ny).toFixed(1)}" class="sh measure${cls}"${st}/>`;
        if(s.s&&mode==='step'){const mx=(s.a[0]+s.b[0])/2,my=(s.a[1]+s.b[1])/2,vert=Math.abs(dx)<Math.abs(dy);top+=`<text class="mlab${cls}" x="${(mx+(vert?(mx<200?-6:6):0)).toFixed(1)}" y="${(my+(vert?4:12)).toFixed(1)}" text-anchor="${vert?(mx<200?'end':'start'):'middle'}"${st}>${isKid()?s.s.replace('= width','= wide').replace('width','wide'):s.s}</text>`}continue}
      if(mode==='color'&&((s.t!=='l'&&s.t!=='e')||s.k==='guide'))continue;
      if(s.t==='l'){lines+=`<path d="M${f(s.a)}L${f(s.b)}" pathLength="1" class="sh ${s.k}${s.auto?' dash':''}${cls}"${st}/>`;if(isNew)top+=`<circle class="start" cx="${s.a[0].toFixed(1)}" cy="${s.a[1].toFixed(1)}" r="7" style="--i:${j-1}"/>`}
      else if(s.t==='e'){const [cx,cy]=s.c;lines+=`<path d="M${(cx-s.rx).toFixed(1)} ${cy.toFixed(1)}a${s.rx} ${s.ry} 0 1 0 ${2*s.rx} 0a${s.rx} ${s.ry} 0 1 0 ${-2*s.rx} 0" pathLength="1" class="sh ${s.k}${cls}"${st}/>`}
      else if(s.t==='p')polys+=`<path d="M${s.pts.map(f).join('L')}Z" class="sh ${s.k}${cls}"${st}/>`;
      else if(s.t==='d'){const lt=isKid()?s.label.replace('VP','dot ').trim():s.label;const lab=s.label&&mode!=='thumb'?`<text class="lab" x="${(s.p[0]+(s.p[0]>330?-40:8)).toFixed(1)}" y="${(s.p[1]-(s.p[1]<40?-24:9)).toFixed(1)}">${lt}</text>`:'';top+=`<g class="dot${cls}"${st}><circle cx="${s.p[0].toFixed(1)}" cy="${s.p[1].toFixed(1)}" r="${mode==='thumb'?6:4.5}"/>${lab}</g>`}
      else if(s.t==='t'&&mode==='step')top+=`<text class="lab ${s.c}${cls}" x="${s.p[0]}" y="${s.p[1]}"${st}>${isKid()&&s.s==='horizon'?'sky line':s.s}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="art ${mode==='step'?'':'final'}${mode==='color'?' colorart':''}" role="img" aria-label="${esc(lesson.title)} drawing"><g>${polys}</g><g>${lines}</g><g>${top}</g></svg>`;
}

  ${l.lib?'':`<section class="panel"><h3>Practice more</h3><p style="font-size:14px;color:var(--muted)">Print the sheet: trace the lines first, then draw it on your own.</p><a class="btn ghost" href="${wsURL(l)}" target="_blank" rel="noopener">${I.dl}Download practice sheet (PDF)</a></section>`}
  <section class="panel"><h3>Share it</h3><p style="font-size:14px">${isKid()?'Ask a grown-up to post your drawing and tag us. We feature the best ones!':'Post your drawing and tag the page. The best ones get featured.'}</p>
    <div class="copyrow"><code id="tagtext">#perspectivesketch @perspective.sketch</code><button class="iconbtn" data-act="copy" aria-label="Copy tags">${I.copy}</button></div></section>
  ${l.lib?`<button class="btn primary wide" data-act="tab" data-tab="draw">${I.pencil}Pick another drawing</button>`:`<button class="btn primary wide" data-act="home">${ni<0?'Back to lessons':'Continue to the next lesson'}</button>`}`;
}
function vChallenge(){
  const doneN=S.days.length,next=doneN+1;if(selDay===null)selDay=Math.min(next,30);
  const cells=PROMPTS.map((_,i)=>{const d=i+1,isDone=d<=doneN,isNext=d===next,proL=d>FREE_DAYS&&!isPro();
    return `<button class="day ${isDone?'done':isNext?'next':'locked'}${selDay===d?' sel':''}" data-act="day" data-d="${d}" aria-label="Day ${d}${isDone?', done':''}">${isDone?I.check:d}${proL?'<span class="pdot"></span>':''}</button>`}).join('');
  const d=selDay,isDone=d<=doneN,isNext=d===next,proL=d>FREE_DAYS&&!isPro();
  let action;
  if(isDone)action=`<button class="btn ghost wide" disabled>${I.check}Done</button>`;
  else if(proL)action=`<button class="btn primary wide" data-act="paywall">${I.gem}Unlock days 8–30 with Pro</button>`;
  else if(isNext)action=`<button class="btn ok wide" data-act="daydone">${I.check}I drew it · +1 gem</button>`;
  else action=`<button class="btn ghost wide" disabled>${I.lock}Finish day ${next} first</button>`;
  return header()+`<section class="hero-c"><p class="eyebrow">Challenge</p><h1>30-Day Perspective Challenge</h1><p>One small drawing a day. Days 1–7 are free.</p><div class="bar" aria-label="${doneN} of 30 days"><span style="width:${doneN/30*100}%"></span></div><p class="eyebrow" style="opacity:.85">${doneN} / 30 days</p></section>
  <div class="days">${cells}</div>
  <section class="panel"><p class="eyebrow">Day ${d}</p><p class="prompt">${esc(PROMPTS[d-1])}</p><p style="color:var(--muted);font-size:14px">About 10 minutes. Pencil, ruler and any paper.</p>${action}</section>`;
}
function vProfile(){
  const lessons=LESSONS.filter(l=>S.done[l.id]).length;
  return header()+`<h1 style="font-size:28px">Your progress</h1>
  <div class="grid4"><div class="stat"><b>${S.gems}</b><span>Gems</span></div><div class="stat"><b>${S.streak}</b><span>Day streak</span></div><div class="stat"><b>${lessons}/${LESSONS.length}</b><span>Lessons done</span></div><div class="stat"><b>${S.days.length}/30</b><span>Challenge days</span></div></div>
  <section class="panel"><h3>My drawings</h3><p class="fine2">Drawings you sent to Arda, with his score and notes.</p><button class="btn ghost" data-act="mine">${I.star}Open my drawings</button></section>
  <section class="panel"><div class="plan"><div><p class="eyebrow">Your plan</p><h3>${isPro()?'Perspective Pro':'Free'}</h3></div>${isPro()?`<span class="chip pro">${I.gem}Pro</span>`:`<button class="btn primary small" data-act="paywall">${I.gem}Go Pro</button>`}</div>
  <p style="font-size:14px;color:var(--muted)">${onTrial()?`Free trial with code ${esc(S.trialCode)}: ${daysLeft()} days left.`:isPro()?'All lessons and all 30 challenge days are open.':trialOver()?'Your free trial has ended. Your progress is saved.':'Free: Unit 1, the two-point box and challenge days 1–7.'}</p>
  ${!isPro()&&!S.trialCode?`<p style="font-size:14px;font-weight:600">Have a code?</p>${codeBox()}`:''}</section>
  <section class="panel"><h3>Invite a friend</h3><p style="font-size:14px;color:var(--muted)">Your friend gets 15 days of Pro free with your code.</p>
  <div class="copyrow"><code id="invtext">${APP_URL}?code=${myCode()}</code><button class="iconbtn" data-act="copyinvite" aria-label="Copy invite link">${I.copy}</button></div>
  <p style="font-size:13px;color:var(--muted)">Your code: <b style="font-family:var(--mono)">${myCode()}</b></p></section>
  <section class="panel"><h3>Who is learning?</h3><div class="seg2"><button data-act="mode" data-mode="adult" aria-pressed="${!isKid()}">Me</button><button data-act="mode" data-mode="kid" aria-pressed="${isKid()}">My child (7–12)</button></div>
  <div class="seg2"><button data-act="voice" aria-pressed="${S.voice}">${S.voice?'Voice on':'Voice off'}</button><button data-act="testvoice">Test the voice</button></div></section>
  <section class="panel"><h3>Badges</h3><div class="badges">${BADGES.map(b=>{const on=b.test();return `<div class="badge${on?' on':''}" title="${esc(b.desc)}"><i>${on?I.medal:I.lock}</i><span>${esc(b.name)}</span></div>`}).join('')}</div></section>
  <section class="panel"><h3>Paper styles</h3><p style="font-size:14px;color:var(--muted)">Spend gems to change the paper in your lessons.</p>
  <div class="shop">${PAPERS.map(pp=>{const own=S.owned.includes(pp.id),sel=S.paper===pp.id;return `<button class="shopitem" data-act="paper" data-p="${pp.id}" aria-pressed="${sel}"><span class="sw sw-${pp.id}"></span><b>${pp.name}</b><small>${sel?'In use':own?'Tap to use':`${I.gem}${pp.cost} gems`}</small></button>`}).join('')}</div></section>
  <section class="panel"><h3>Reset</h3><p style="font-size:14px;color:var(--muted)">This is a working prototype. Progress is saved on this device only.</p>
  <button class="btn ghost" data-act="reset">${resetArm?'Tap again to erase all progress':'Reset progress'}</button></section>`;
}
function paywall(){
  return `<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pw-title" data-stop="1">
  <div class="sheet-top"><div><p class="eyebrow">Perspective Pro</p><h2 id="pw-title">Draw anything in perspective</h2></div><button class="iconbtn" data-act="closesheet" aria-label="Close">${I.x}</button></div>
  <ul class="feat"><li>${I.check}<span>Every lesson: two-point houses, streets, three-point towers</span></li><li>${I.check}<span>All 30 days of the challenge</span></li><li>${I.check}<span>A new lesson every week</span></li><li>${I.check}<span>Printable practice workbooks (PDF)</span></li></ul>
  <div class="plans"><button class="planopt" aria-pressed="true" data-act="plan"><span class="save">Save 50%</span><small>Yearly</small><b>$29.99</b><small>$2.50 / month</small></button><button class="planopt" aria-pressed="false" data-act="plan"><small>Monthly</small><b>$4.99</b><small>billed monthly</small></button></div>
  <button class="btn primary wide" data-act="gopro">Continue with Pro</button>
  ${!S.trialCode&&!S.pro?`<div style="display:flex;flex-direction:column;gap:8px"><p style="font-size:14px;font-weight:600">Have a code? Get 15 days free</p>${codeBox()}</div>`:''}
  <p class="fine">Prototype: example prices, no payment is taken. The button unlocks Pro on this device so you can try every lesson.</p></div></div>`;
}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(scrollTop,quiet){
  document.body.classList.toggle('kid',isKid());document.body.dataset.paper=S.paper||'grid';
  const name=S.mode?view.name:'onboard';
  app.classList.toggle('full',name==='lesson'||name==='complete'||name==='color');
  app.classList.toggle('lessonv',name==='lesson');app.classList.toggle('learnv',name==='learn');
  setTabs(name==='mine'?'profile':name);
  app.innerHTML=name==='onboard'?vOnboard():name==='learn'?vLearn():name==='lesson'?vLesson():name==='complete'?vComplete():name==='draw'?vDraw():name==='challenge'?vChallenge():name==='mine'?vMine():name==='color'?vColor():vProfile();
  if(name==='lesson'&&!quiet)narrate(curL(),view.s);
  if(name==='color')colorInit();
  if(scrollTop)window.scrollTo(0,0);
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
const sheet=document.getElementById('sheetwrap');
function openPaywall(focusCode){sheet.innerHTML=paywall();sheet.hidden=false;const ci=sheet.querySelector('#codein');(focusCode&&ci?ci:sheet.querySelector('[data-act="gopro"]')).focus()}
function doApply(){const inp=document.getElementById('codein');if(!inp)return;const r=applyCode(inp.value);toast(CODE_MSG[r]);if(r==='ok'){closePaywall();render()}}
function closePaywall(){sheet.hidden=true;sheet.innerHTML=''}

function openLesson(i,lib){
  const l=(lib?LIB:LESSONS)[i];
  if(l.pro&&!isPro()){openPaywall();return}
  photoURL=null;track('open/'+l.id);view={name:'lesson',i,s:0,lib:!!lib};render(true);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='closesheet'){if(el.classList.contains('scrim')&&e.target!==el)return;closePaywall();return}
  if(a==='tab'){view={name:el.dataset.tab};resetArm=false;render(true);return}
  if(a==='open'){openLesson(+el.dataset.i);return}
  if(a==='node'){const i=+el.dataset.i,l=LESSONS[i];
    if(S.done[l.id]||i===nextIdx())openLesson(i);
    else toast(`Finish “${LESSONS[nextIdx()].title}” first`);return}
  if(a==='soon'){toast('Coming soon');return}
  if(a==='lib'){openLesson(+el.dataset.i,true);return}
  if(a==='close'||a==='home'){hush();view={name:'learn'};render(true);return}
  if(a==='mode'){S.mode=el.dataset.mode;save();if(view.name==='profile'){render();return}view={name:'learn'};render(true);
    toast(isKid()?'Kids mode: simple words and a fun voice':'Welcome! Start with lesson 1');return}
  if(a==='voice'){S.voice=!S.voice;save();if(!S.voice)hush();render(false,!S.voice);return}
  if(a==='testvoice'){play(isKid()?'k-test':'a-test',true);return}
  if(a==='prev'){view.s=Math.max(0,view.s-1);render();return}
  if(a==='replay'){const c=document.getElementById('canvas');const l=curL();c.innerHTML=art(l,view.s,'step');narrate(l,view.s);return}
  if(a==='next'){const l=curL();
    if(view.s<l.steps.length-1){view.s++;render();return}
    const before=earned();let gained=0,g=0;if(!S.done[l.id]){S.done[l.id]=true;gained=20;S.xp+=gained;g=gemsFor(l);S.gems+=g}
    bumpStreak();save();track('done/'+l.id);view={name:'complete',i:view.i,lib:view.lib,gained,gems:g,badges:newBadges(before)};render(true);return}
  if(a==='copy'){const txt=document.getElementById('tagtext').textContent;
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('tagtext'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Tags copied'),fallback)}catch(err){fallback()}return}
  if(a==='day'){selDay=+el.dataset.d;render();return}
  if(a==='daydone'){const before=earned();const d=S.days.length+1;S.days.push(d);S.xp+=10;S.gems+=1;bumpStreak();save();selDay=Math.min(d+1,30);toast(`Day ${d} done · +1 gem`);render();badgeToast(newBadges(before));return}
  if(a==='paper'){const pp=PAPERS.find(x=>x.id===el.dataset.p);if(!pp)return;
    if(S.owned.includes(pp.id)){S.paper=pp.id;save();render();toast(pp.name+' selected');return}
    if(S.gems<pp.cost){toast(`You need ${pp.cost-S.gems} more gems. Finish lessons to earn them.`);return}
    const before=earned();S.gems-=pp.cost;S.owned.push(pp.id);S.paper=pp.id;save();render();toast(`${pp.name} unlocked`);badgeToast(newBadges(before));return}
  if(a==='mine'){hush();view={name:'mine'};mine.loading=true;mine.err='';render(true);loadMine(false);return}
  if(a==='send'){doSend();return}
  if(a==='color'){hush();view=Object.assign({},view,{name:'color'});render(true);track('color/'+curL().id);return}
  if(a==='colorback'){view=Object.assign({},view,{name:'complete'});render(true);return}
  if(a==='pick'){col.color=el.dataset.c;if(col.tool==='erase')col.tool='fill';document.querySelectorAll('.sw2').forEach(b=>{const on=b===el;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});document.querySelectorAll('[data-act="ctool"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===col.tool));return}
  if(a==='ctool'){col.tool=el.dataset.t;document.querySelectorAll('[data-act="ctool"]').forEach(b=>b.setAttribute('aria-pressed',b===el));return}
  if(a==='cundo'){const cv=document.getElementById('cc');const u=col.undo.pop();if(u&&cv)cv.getContext('2d').putImageData(u,0,0);return}
  if(a==='cclear'){const cv=document.getElementById('cc');if(cv){pushUndo();cv.getContext('2d').clearRect(0,0,800,600)}return}
  if(a==='csave'){colorSave();return}
  if(a==='paywall'){openPaywall(el.dataset.focus==='code');return}
  if(a==='applycode'){doApply();return}
  if(a==='copyinvite'){const txt=document.getElementById('invtext').textContent;
    const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('invtext'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Copy it from here.')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Invite link copied'),fb)}catch(err){fb()}return}
  if(a==='plan'){sheet.querySelectorAll('.planopt').forEach(b=>b.setAttribute('aria-pressed',b===el?'true':'false'));return}
  if(a==='gopro'){S.pro=true;save();closePaywall();toast('Pro unlocked on this device');render();return}
  if(a==='reset'){if(!resetArm){resetArm=true;render();return}S=Object.assign(blank(),{trialEnd:S.trialEnd,trialCode:S.trialCode,myCode:S.myCode,gemsInit:true});save();resetArm=false;selDay=null;toast('Progress erased');render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closePaywall();if(e.key==='Enter'&&e.target&&e.target.id==='codein'){e.preventDefault();doApply()}});
document.addEventListener('change',e=>{
  if(e.target.id!=='photo')return;const file=e.target.files&&e.target.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{const before=earned();photoURL=r.result;view.sent=false;S.photos++;save();render();badgeToast(newBadges(before))};r.readAsDataURL(file);
});
async function doSend(){
  if(view.sending||!photoURL)return;const l=curL();
  const ni=document.getElementById('subname'),ii=document.getElementById('subig');
  const name=(ni&&ni.value||'').trim().slice(0,40),ig=(ii&&ii.value||'').trim().replace(/^@+/,'').slice(0,40);
  if(!name){toast(isKid()?'Write your first name first':'Add your name first');ni&&ni.focus();return}
  S.subName=name;S.subIg=ig;save();view.sending=true;render();
  try{await sbSubmit(name,ig?'@'+ig:'',l.id,photoURL);view.sent=true;S.subsN=(S.subsN||0)+1;save();track('submit/'+l.id);toast('Sent! Arda will review it soon.')}
  catch(e){toast(sendErr(e))}
  view.sending=false;if(view.name==='complete')render();
}
let startMsg='';
try{const q=new URLSearchParams(location.search).get('code');if(q){startMsg=CODE_MSG[applyCode(q)];history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}
render();
if(startMsg)toast(startMsg);
if(sbGet())setTimeout(()=>loadMine(true),1500);
</script>
</body>
</html>
